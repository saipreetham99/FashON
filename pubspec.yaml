name: fashon
description: Rate how your clothes work together, and see them worn.
publish_to: none

version: 0.1.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  # State
  provider: ^6.1.4

  # Local persistence
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5

  # Capture + image handling
  image_picker: ^1.1.2
  image: ^4.3.0

  # The user's own Gemini key, in the platform keystore
  flutter_secure_storage: ^9.2.2

  # Gemini REST
  http: ^1.2.2

  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
